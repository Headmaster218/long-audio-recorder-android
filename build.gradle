// Do not silently build the historical root baseline. Use the fresh assembly.
if (file('checkpoints').exists() || !file('ASSEMBLED_SOURCE.json').isFile()) {
    throw new GradleException('Run python3 scripts/prepare-delivery.py --output ../recorder-delivery from the Git checkout first. Build only its assembled source directory.')
}
// Optional Gradle entry point; the local direct-SDK script is the no-download build path.
// No AGP/Gradle version or wrapper is fetched automatically in this development slice.
buildscript {
    def selected = project.findProperty('agpVersion')
    if (selected == null) throw new GradleException('Set -PagpVersion to an installed, API-37-compatible Android Gradle Plugin version. See docs/android-app.md; use the direct SDK build for offline verification.')
    repositories { google(); mavenCentral() }
    dependencies { classpath "com.android.tools.build:gradle:${selected}" }
}
